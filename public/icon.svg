<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Bezel casing gradient -->
    <linearGradient id="radar-bezel" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#334155" />
      <stop offset="50%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <!-- Scope background -->
    <radialGradient id="radar-scope" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#042F2E" />
      <stop offset="65%" stopColor="#022020" />
      <stop offset="100%" stopColor="#011414" />
    </radialGradient>
    <!-- Sweep gradient -->
    <linearGradient id="radar-sweep" x1="16" y1="16" x2="27.5" y2="9.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.85" />
      <stop offset="40%" stopColor="#065F46" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#042F2E" stopOpacity="0" />
    </linearGradient>
    <!-- Blip glow -->
    <radialGradient id="blip-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#A7F3D0" />
      <stop offset="40%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#059669" />
    </radialGradient>
  </defs>

  <!-- Base container con esquinas sutilmente redondeadas para pestañas -->
  <rect width="32" height="32" rx="7" fill="#090D16" />
  <circle cx="16" cy="16" r="14" fill="url(#radar-bezel)" stroke="#475569" stroke-width="0.8" />
  <circle cx="16" cy="16" r="12.5" fill="url(#radar-scope)" stroke="#0D9488" stroke-width="0.6" />

  <!-- Concentric Radar Rings -->
  <circle cx="16" cy="16" r="9.5" stroke="#14B8A6" stroke-width="0.6" stroke-dasharray="1.5 1.5" opacity="0.45" />
  <circle cx="16" cy="16" r="6" stroke="#14B8A6" stroke-width="0.65" opacity="0.6" />
  <circle cx="16" cy="16" r="2.5" stroke="#14B8A6" stroke-width="0.5" opacity="0.5" />

  <!-- Crosshairs -->
  <line x1="3.5" y1="16" x2="28.5" y2="16" stroke="#0D9488" stroke-width="0.6" opacity="0.55" />
  <line x1="16" y1="3.5" x2="16" y2="28.5" stroke="#0D9488" stroke-width="0.6" opacity="0.55" />

  <!-- Radar sweep wedge (sector) -->
  <path d="M 16 16 L 27.5 9.5 A 12.5 12.5 0 0 0 16 3.5 Z" fill="url(#radar-sweep)" opacity="0.65" />
  <!-- Leading beam edge -->
  <line x1="16" y1="16" x2="27.5" y2="9.5" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" />

  <!-- Detected Lead Blips (Targets) -->
  <!-- Target 1: Top right near beam -->
  <circle cx="21.5" cy="11.5" r="3" fill="#34D399" opacity="0.3" />
  <circle cx="21.5" cy="11.5" r="1.5" fill="url(#blip-glow)" />
  <circle cx="21.5" cy="11.5" r="0.7" fill="#FFFFFF" />

  <!-- Target 2: Bottom left -->
  <circle cx="10" cy="20.5" r="2.2" fill="#38BDF8" opacity="0.25" />
  <circle cx="10" cy="20.5" r="1.2" fill="#38BDF8" />
  <circle cx="10" cy="20.5" r="0.5" fill="#FFFFFF" />

  <!-- Center origin pin -->
  <circle cx="16" cy="16" r="1.2" fill="#34D399" />
  <circle cx="16" cy="16" r="0.6" fill="#FFFFFF" />
</svg>
